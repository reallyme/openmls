# Duplicate versions increase the number of implementations and patch levels
# that must be audited. Keep unavoidable exceptions exact and documented
# so it becomes a hard failure as soon as any other duplicate enters the
# deployable provider graph.
[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
skip = [
    # Buffa requires base64 0.22 for JSON support. Crypto and Codec require
    # base64 0.23, and neither range accepts the other version.
    { crate = "base64@0.22.1", reason = "Required by the JSON feature of the pinned ReallyMe Buffa runtime" },
    # Current serde and thiserror derive macros use Syn 3, while tls_codec and
    # several cryptographic derive macros still use Syn 2. Both are build-time
    # proc-macro dependencies and do not create duplicate runtime parsers.
    { crate = "syn@3.0.9", reason = "Build-time derive ecosystem is transitioning from Syn 2 to Syn 3" },
]

# Keep this list exact for the deployable provider graph so a dependency cannot
# introduce a new license class unnoticed.
[licenses]
allow = [
    "Apache-2.0",
    "BSD-1-Clause",
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[[licenses.exceptions]]
# Buffa uses foldhash via hashbrown for its protobuf map implementation.
allow = ["Zlib"]
crate = "foldhash@0.1.5"

# The deployable provider graph may use crates.io and local workspace paths,
# but it must not acquire code from an unreviewed registry or Git repository.
# Git dependencies needed by upstream-only tools remain outside this
# provider-rooted release gate.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
