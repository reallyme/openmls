[package]
name = "openmls-fuzz"
version = "0.0.0"
authors = ["Automatically generated"]
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
openmls_traits = { path = "../traits", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_reallyme_provider = { path = "../openmls_reallyme_provider", features = [
    "draft-ietf-mls-pq-ciphersuites",
] }

[dependencies.openmls]
path = "../openmls"

